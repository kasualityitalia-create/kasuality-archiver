<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="layerTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="layerMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="layerBot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="strap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- 3 Stacked Compressed Layers (modern evolution of the classic archiver stack) -->
  <rect x="24" y="34" width="208" height="54" rx="16" fill="url(#layerTop)" stroke="#C7D2FE" stroke-width="4"/>
  <rect x="24" y="101" width="208" height="54" rx="16" fill="url(#layerMid)" stroke="#BFDBFE" stroke-width="4"/>
  <rect x="24" y="168" width="208" height="54" rx="16" fill="url(#layerBot)" stroke="#A7F3D0" stroke-width="4"/>

  <!-- Left spine highlights -->
  <rect x="40" y="48" width="12" height="26" rx="6" fill="#E0E7FF" opacity="0.85"/>
  <rect x="40" y="115" width="12" height="26" rx="6" fill="#DBEAFE" opacity="0.85"/>
  <rect x="40" y="182" width="12" height="26" rx="6" fill="#D1FAE5" opacity="0.85"/>

  <!-- Central Compression Strap -->
  <rect x="92" y="22" width="72" height="212" rx="14" fill="url(#strap)" stroke="#93C5FD" stroke-width="5"/>

  <!-- Metallic Clasp / Buckle Frame -->
  <rect x="84" y="84" width="88" height="88" rx="18" fill="#0F172A" stroke="#F8FAFC" stroke-width="6"/>

  <!-- Bold Kasuality 'K' Emblem inside the Clasp -->
  <path d="M108 104 V152 M108 128 L146 104 M108 128 L146 152" stroke="#93C5FD" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
